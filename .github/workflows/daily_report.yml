name: Global Creator Daily Bot

on:
  schedule:
    # 每天北京时间早上 08:00 (UTC 00:00) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 开启 pip 缓存加速构建

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python daily_feishu_bot.py
